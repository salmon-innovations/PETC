appId: com.salmoninnovations.petc
productName: PETC Desktop
copyright: "Copyright © 2025 Salmon Innovations"

directories:
  output: dist/installer

artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# Renderer built bundle
files:
  - package.json
  - from: renderer/dist
    to: .
    filter:
      - "**/*"
  - from: electron/dist
    to: electron/dist
    filter:
      - "main.js"
      - "preload.js"

# PyInstaller-frozen sidecar binary (built separately before electron-builder)
extraResources:
  - from: sidecar/dist/petc
    to: petc-sidecar
    filter:
      - "**/*"

asar: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PETC Desktop

publish:
  provider: generic
  url: https://petc.siiportal.com/downloads/desktop/stable
  channel: stable
