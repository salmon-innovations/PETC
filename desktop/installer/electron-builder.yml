appId: com.salmoninnovations.petc
productName: PETC Desktop
copyright: "Copyright © 2025 Salmon Innovations"

directories:
  buildResources: installer/assets
  output: dist/installer

# Renderer built bundle
files:
  - package.json
  - from: renderer/dist
    to: electron/renderer
    filter:
      - "**/*"
  - from: electron/dist
    to: electron/dist
    filter:
      - "main.js"
      - "preload.js"

# PyInstaller-frozen sidecar binary (built separately before electron-builder)
extraResources:
  - from: sidecar/dist/petc
    to: petc-sidecar
    filter:
      - "**/*"

# Entry point is declared in desktop/package.json (electron/dist/main.js).

asar: true

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: installer/assets/entitlements.mac.plist
  entitlementsInherit: installer/assets/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  # Commissioning writes petc.properties beside PETC Desktop.exe.  A
  # per-machine installation therefore obtains administrator approval during
  # install; upgrades leave this non-packaged file in place.
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PETC Desktop
  include: installer/commissioning.nsh

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office

publish:
  provider: generic
  url: https://releases.petc.example.com
  channel: stable
