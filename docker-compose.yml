# Postgres (driving-school-postgres) and Redis (driving-school-redis) are
# already running on the host at localhost:5432 and localhost:6379.
# This file manages: cloud backend (Spring Boot), cloud frontend (Nginx).
# Photo storage uses AWS S3 through the host-run production cloud app.
# The desktop Electron app is built separately — it never runs in Docker.

services:
  backend:
    build:
      context: ./cloud/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # host.docker.internal resolves to the Docker host where the shared
    # Postgres and Redis containers are listening on published ports.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/petc
      DB_USER: petc
      DB_PASS: petc
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-must-be-at-least-32-chars!
    ports:
      - "8080:8080"

  cloud-frontend:
    build:
      context: ./cloud/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Points at the production cloud app in cloud/ (run via ./gradlew bootRun on
    # the host). The `backend` compose service builds cloud/backend, which is the
    # deprecated spike — see README "Project Layout".
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"
