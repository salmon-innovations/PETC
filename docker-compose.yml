# Postgres (driving-school-postgres) is already running on the host at
# localhost:5432.
# This file manages: MinIO, the production cloud backend (Spring Boot), and
# the cloud frontend (Nginx). The legacy cloud/backend/ spike is not used.
# The desktop Electron app is built separately — it never runs in Docker.

services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./cloud
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    # host.docker.internal resolves to the Docker host where the shared
    # Postgres is listening on a published port.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: ${PETC_DB_URL:-jdbc:postgresql://host.docker.internal:5432/petc}
      DB_USER: petc
      DB_PASS: petc
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: petc-photos
      S3_REGION: ap-southeast-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: dev-secret-must-be-at-least-32-chars!
      # PayMongo is fail-closed by default. Supply rotated test credentials via
      # the shell/.env only when exercising QR payments locally.
      PAYMONGO_ENABLED: ${PAYMONGO_ENABLED:-false}
      PAYMONGO_LIVE_MODE: "false"
      PAYMONGO_EXPOSE_TEST_URL: ${PAYMONGO_EXPOSE_TEST_URL:-true}
      PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY:-}
      PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"

  cloud-frontend:
    build:
      context: ./cloud/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Defaults to the cloud backend service in this compose stack. Override for
    # host-run development (for example, API_UPSTREAM=host.docker.internal:8080).
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-backend:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"

volumes:
  minio_data:
