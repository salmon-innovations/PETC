spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petc}
    username: ${DB_USER:petc}
    password: ${DB_PASS:petc}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

petc:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!!}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
  s3:
    # Leave blank on AWS so the SDK uses the regional S3 endpoint and the ECS
    # task role. Local development can still set the MinIO endpoint and keys.
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:petc-photos}
    region: ${S3_REGION:ap-southeast-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presigned-put-ttl-seconds: ${S3_PRESIGN_TTL:300}
  gov:
    mock: ${GOV_MOCK:true}   # flip to false once real sandbox creds arrive
    # Deployment can begin in mock mode. Set this true once the live government
    # integration is commissioned; the production guard will then fail closed.
    require-live: ${GOV_REQUIRE_LIVE:false}
  # LTMS is independently guarded from the legacy registry adapter.  Defaults
  # deliberately permit no LTMS egress in any local/test deployment.
  ltms:
    mode: ${LTMS_MODE:mock}
    outbound-enabled: ${LTMS_OUTBOUND_ENABLED:false}
    # Separate mutation gate: false permits no CEC upload or replacement even
    # if read-only production LTMS access is enabled later.
    upload-enabled: ${LTMS_UPLOAD_ENABLED:false}
    # Production adds a separate, disabled-by-default deployment opt-in. A
    # live LTMS client or the generic upload gate alone cannot mutate CECs.
    production-upload-enabled: ${LTMS_PRODUCTION_UPLOAD_ENABLED:false}
    commissioning-approved: ${LTMS_COMMISSIONING_APPROVED:false}
    # Comma-separated exact HTTPS hosts. Empty is valid only while outbound is disabled.
    allowed-hosts: ${LTMS_ALLOWED_HOSTS:}
    petc-base-url: ${LTMS_PETC_BASE_URL:}
    jwt-base-url: ${LTMS_JWT_BASE_URL:}
    connect-timeout: ${LTMS_CONNECT_TIMEOUT:5s}
    read-timeout: ${LTMS_READ_TIMEOUT:15s}
    total-timeout: ${LTMS_TOTAL_TIMEOUT:20s}
    # CEC = Philippine year + five-digit PETC code + 0 + per-center OR sequence.
    # Keep the sequence width configurable until LTMS confirms its conflicting examples.
    cec-or-number-width: ${LTMS_CEC_OR_NUMBER_WIDTH:6}
  ingest:
    dev-key-enabled: ${DEV_CENTER_KEY_ENABLED:true}
    dev-key: ${DEV_CENTER_KEY:dev-insecure-key}
    dev-tenant-slug: ${DEV_CENTER_SLUG:dev-center}
    dev-tenant-name: ${DEV_CENTER_NAME:Mock PETC Center}
  submission:
    max-attempts: ${SUBMISSION_MAX_ATTEMPTS:5}
  billing:
    finalizer-delay-ms: ${BILLING_FINALIZER_DELAY_MS:60000}
  paymongo:
    enabled: ${PAYMONGO_ENABLED:false}
    base-url: ${PAYMONGO_BASE_URL:https://api.paymongo.com}
    secret-key: ${PAYMONGO_SECRET_KEY:}
    webhook-secret: ${PAYMONGO_WEBHOOK_SECRET:}
    live-mode: ${PAYMONGO_LIVE_MODE:false}
    expose-test-url: ${PAYMONGO_EXPOSE_TEST_URL:false}
    qr-expiry-seconds: ${PAYMONGO_QR_EXPIRY_SECONDS:1800}
    minimum-topup-centavos: ${PAYMONGO_MINIMUM_TOPUP_CENTAVOS:10000}
    maximum-topup-centavos: ${PAYMONGO_MAXIMUM_TOPUP_CENTAVOS:5000000}
    connect-timeout: ${PAYMONGO_CONNECT_TIMEOUT:5s}
    request-timeout: ${PAYMONGO_REQUEST_TIMEOUT:20s}
    webhook-tolerance: ${PAYMONGO_WEBHOOK_TOLERANCE:5m}
    reconcile-delay-ms: ${PAYMONGO_RECONCILE_DELAY_MS:30000}
    webhook-worker-delay-ms: ${PAYMONGO_WEBHOOK_WORKER_DELAY_MS:1000}

logging:
  level:
    com.petc: DEBUG
    org.flywaydb: INFO
