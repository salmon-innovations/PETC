spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petc}
    username: ${DB_USER:petc}
    password: ${DB_PASS:petc}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

petc:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!!}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
  s3:
    # Leave blank on AWS so the SDK uses the regional S3 endpoint and the ECS
    # task role. Local development can still set the MinIO endpoint and keys.
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:petc-photos}
    region: ${S3_REGION:ap-southeast-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presigned-put-ttl-seconds: ${S3_PRESIGN_TTL:300}
  gov:
    mock: ${GOV_MOCK:true}   # flip to false once real sandbox creds arrive
    # Deployment can begin in mock mode. Set this true once the live government
    # integration is commissioned; the production guard will then fail closed.
    require-live: ${GOV_REQUIRE_LIVE:false}
  ingest:
    dev-key-enabled: ${DEV_CENTER_KEY_ENABLED:true}
    dev-key: ${DEV_CENTER_KEY:dev-insecure-key}
    dev-tenant-slug: ${DEV_CENTER_SLUG:dev-center}
    dev-tenant-name: ${DEV_CENTER_NAME:Mock PETC Center}
  submission:
    max-attempts: ${SUBMISSION_MAX_ATTEMPTS:5}

logging:
  level:
    com.petc: DEBUG
    org.flywaydb: INFO
