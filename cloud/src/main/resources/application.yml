spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/petc}
    username: ${DB_USER:petc}
    password: ${DB_PASS:petc}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

petc:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!!}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 30
  s3:
    # Empty endpoint uses native AWS S3. Set S3_ENDPOINT only for an
    # S3-compatible development service; custom endpoints use path-style URLs.
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:salmon-innovations-petc-dev-photos-016257615426}
    region: ${S3_REGION:ap-southeast-1}
    # Empty static keys use the AWS SDK default credential chain. For local
    # development set AWS_PROFILE=salmon-innovations.
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    presigned-put-ttl-seconds: ${S3_PRESIGN_TTL:300}
  gov:
    mock: ${GOV_MOCK:true}   # flip to false once real sandbox creds arrive
  ingest:
    dev-key-enabled: ${DEV_CENTER_KEY_ENABLED:true}
    dev-key: ${DEV_CENTER_KEY:dev-insecure-key}
    dev-tenant-slug: ${DEV_CENTER_SLUG:dev-center}
    dev-tenant-name: ${DEV_CENTER_NAME:Mock PETC Center}
  submission:
    max-attempts: ${SUBMISSION_MAX_ATTEMPTS:5}

logging:
  level:
    com.petc: DEBUG
    org.flywaydb: INFO
